<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>

    <script>
    var arr1=['zoo','hong', 'kim'];
    var arr2=[52, 100, 12, 98, 32];
    document.write('arr1연결 : ' + arr1.join('  -   ') + '<br>');   
    //배열변수.slice(a,b) : 배열변수 a번째~b번째 앞까지 복제한 배열을 return
    //배열변수.slice(a) : 배열변수 a번째~끝까지 복제한 배열을 return
    //배열변수.slice() : 배열변수를 복제한 배열을 return
    let originalArr1 =arr1.slice();//깊은 복사 
    originalArr1=[...arr1];        //깊은 복사
    originalArr1=Array.from(arr1); //깊은 복사
    arr1.sort();
    document.write('원본(정렬전)' + originalArr1+'<br>');    
    document.write('정렬후' + arr1 + '<br>');
    arr1.reverse(); // arr1의 순서를 reverse
    document.write('정렬후(내림차순)' + arr1 + '<br>');
    document.write('정렬전' + arr2 + '<br>');
    arr2.sort(function(left,right){
        //return left-right //오름차순정렬
        return right-left; // 내림차순정렬 아래 if절을 간단한게 표현가능

        // if (left<right){// 내림차순정렬(앞에 큰값순)
        //     return 1; //양수면 right가 앞(자자를 바꿈)
        // }else if(left>right){
        //     return -1; // 음수를 return하면 left가 앞
        // }else{
        //     return 0; // 0을 return하면 그대로        
        // }//if


    });
    document.write('정렬후' + arr2 + '<br>'); //Ascii 코드기준으로 숫자를 문자로 인식함 -> 콜백함수로 정의 필요
    let top3 = arr2.slice(0,3); //0번째부터 3번쨰 앞까지 추출
    document.write('top' + top3 + '<br>');

    

    </script>
</head>
