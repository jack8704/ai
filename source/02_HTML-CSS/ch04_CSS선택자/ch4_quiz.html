<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
/***전체적인 레이아웃***/
        * {
            margin: 0;
            padding: 0;
        }
#header, #content, #footer{
      width:1000px;
      margin: 0 auto;
      overflow: hidden;}

        #header > div, #content > div, #footer > div {
            float: left;
            border: 1px solid gray;
            background-color: lightgray;
        }
        .left, .right{width:150px; height:150px;}
        .center{width:692px; height :150px;}
        #content>div{height:300px;}

    /***border 뒹굴리기***/
    #header .left,#footer .right{border-radius:30px 0;}
    #header .right,#footer .left{border-radius:0 30px;}
    #header .center{border-radius:0 0 30px 30px;}
    #content .left{border-radius:0 30px 30px 0;}
    #content .center{border-radius:30px 30px 30px 30px;}
    #content .right{border-radius:30px 0 0 30px;}
    #footer .center{border-radius:30px 30px 0 0;}
    /***#content .center(nav,academy)***/
    /***#content .right (하위3목록만 다른색으로)***/
        #nav {
            width: 690px;
            margin: 10px auto;
        }
        #nav ul{
        overflow:hidden;
        padding:0;
        }
        #nav > ul > li {
            float: left;
            list-style: none;
            text-align: center;
            padding: 1px;
            margin : 0px auto;
            font-size: 2em;
            font-weight: bold;
            width: 33%;
        }
    #nav ul li a{color:black;
                 text-decoration:none;
    }
    #academy{text-align:center;}
    #academy>h2{padding:40px;}
    .right ol {width: 100px;
            margin: 0 0 0 40px;
    }
    .right ol li:nth-child(9)~li{color:red;}
    </style>
</head>
<body>
     <div id="header">
         <div class="left"></div>
         <div class="center"></div>
         <div class="right"></div>
     </div>
     <div id="content">
         <div class="left"></div>
         <div class="center">
             <div id="nav">
                 <ul>
                     <li><a href="#1">menu1</a></li>
                     <li><a href="#2">menu2</a></li>
                     <li><a href="#3">menu3</a></li>
                 </ul>
             </div>
             <div id="academy">
                 <h2>AL 개발자 양성과정</h2>
                 <p>파이썬, 웹표준,DBMS, 딥러닝, 자연어처리, 생성형 ai, 머신러닝, 프로젝트, flask, 장고</p>
             </div>
         </div>
         <div class="right">
             <ol>
                 <li>태그</li>
                 <li>전체(*)</li>
                 <li>#id, .class</li>
                 <li>속성</li>
                 <li>후손,자손(>)</li>
                 <li>동위+~</li>
                 <li>반응:hover</li>
                 <li>상태:focus</li>
                 <li>구조:</li>
                 <li>문자</li>
                 <li>링크</li>
                 <li>부정</li>
             </ol>
         </div>
     </div>

     <div id="footer">
         <div class="left"></div>
         <div class="center"></div>
         <div class="right"></div>
     </div>
</body>
</html>
