<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title></title>
  <script>
    let child;
    const openLarge = () => {
      //새창열기
      child = open('5_child(large).html','','width=500, height=610, left=100');
      if(!child){
        alert('팝업 차단 해제');}
    };
    const closeLarge = () => {
      //열려진 새창 닫기
      child.close();
    };
  </script>
</head>
<body>
  <h2>작은 그림의 parent창</h2>
  <img src="ch09_img/small.jpg" alt="작은그림" onmouseover="openLarge()" onmouseout="closeLarge()">
</body>
</html>
