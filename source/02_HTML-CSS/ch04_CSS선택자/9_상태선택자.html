<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        body{width: 350px;
            margin: 100px auto;
        }
        input:focus {
            background-color: yellow;
            border: 5px solid green;
            outline: none;
        }
        input:enabled{ /*focus가능*/
            color:green;}

        }
        input:disabled { /*focus가능*/
            color:black;
                         }
        input:read-only{ /*readonly이거나 disabled*/
            color:red;
        }

    </style>
</head>
<body>
 <form>
     이름 <input type="text" name="name" /><br />
     아뒤 <input type="text" name="ID" /><br />
     시급 <input type="text" name="sal" value="11000" disabled="disabled" /><br />
     생일 <input type="text" name="birth" value="981212" readonly="readonly" /><br />
     <input type="submit" />
 </form>
</body>
</html>
