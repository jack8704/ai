<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>

<style>
    * {margin: 0;
        padding: 0;

    }
    div#nav{width: 200px;
            margin: 10px auto;
    }
    #nav ul{
            list-style : none;
            margin : 10px auto;

    }
    #nav ul li{
            list-style: none;
            width :140px;
            margin: 2px;
            padding: 4px;
            text-align: center;
            border: 1px solid lightgray;
            font-size: 1.2em;
        }
    a {text-decoration-line: none;
        font-weight: bold;
        color:black;
    }
    #nav li:nth-child(2n){/*#nav 밑의 짝수번째 li*/
                          background-color:yellow;
    }
    #nav li:nth-child(2n+1) { /*#nav 밑의 홀수번째 li*/
        background-color: orange;
    }
    #nav li:first-child { /*#nav 아래의 첫번째 li*/
        border-radius: 12px 12px 0 0;
    }
    #nav li:last-child { /*#nav 아래의 마지막li*/
        border-radius: 0 0 12px 12px;
    }
</style>
<body>
    <div id="nav">
        <ul>
            <li><a href="#">menu1</a></li>
            <li><a href="#">menu2</a></li>
            <li><a href="#">menu3</a></li>
            <li><a href="#">menu4</a></li>
            <li><a href="#">menu5</a></li>
            <li><a href="#">menu6</a></li>
            <li><a href="#">menu7</a></li>
            <li><a href="#">menu8</a></li>
        </ul>
    </div>
</body>
</html>
