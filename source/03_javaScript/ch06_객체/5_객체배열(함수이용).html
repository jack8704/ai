<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
<title></title>
<script>
//객체를 반환하는 일반함수
function makeStudent(name, kor, mat, eng){
    let resultObj={
        'name':name, 
        'kor':kor, 
        'mat': mat, 
        'eng':eng,
        'getSum':function(){
            return this.kor + this.mat + this.eng;
        }, //getSum function
        'getAvg':function(){
            return Math.round(this.getSum() /3*10)/10; 
        }, //getAvg function
        'toString':function(){
            let output='';
            for(let key in this){
            if (key!='getSum' && key!='getAvg' && key!='toString'){
                output += key + ':' + this[key] + ' &nbsp; '; 
            }else if(key=='getSum' || key=='getAvg'){
                output += key.substring(3).toUpperCase() + ':' +this[key]()+ ' &nbsp;';  
            }//if
            }; //for
            return output;
        }, //toString function
    };//resultObj
    return resultObj;
}// makeStudent function 
let students=[];
students.push(makeStudent('홍길동',90,34,23));
students.push(makeStudent('마길동',91,35,22));
students.push(makeStudent('가길동',92,36,24));
students.push(makeStudent('나길동',93,37,25));
students.push(makeStudent('다길동',94,38,26));

students.forEach(element => document.write(element+'<hr>'));

</script>
</head>

</body>
</html>
