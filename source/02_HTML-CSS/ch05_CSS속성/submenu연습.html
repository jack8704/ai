<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>

        #wrap{width:840px;
              margin:0 auto;

        }
        ul {
            overflow: hidden;
            padding: 0;
            text-align :center;
        }
        li{list-style : none;
           line-height : 40px;
           background-color:hotpink;
        }
        ul > li {
            list-style: none;
            text-align: center;
            width: 200px;
            float: left;
            margin: 3.5px;
            background-color: pink;
        }
        .submenu{display:none;}
        ul>li:hover .submenu{
            display:block;
        }
        ol {
            padding: 0;
            width: 200px;
            margin: 0 auto;
            position: absolute;
        }
        a{text-decoration:none;
          font-size: 20px;
          font-style : italic;
          font-weight: bolder;

          
        }
    </style>
</head>
<body>
    <div id="wrap">
        <ul>
            <li>
                <a href="#1">menu1</a>
                <ol class="submenu">
                    <li><a href="#1-2">menu1-2</a></li>
                    <li><a href="#1-2">menu1-2</a></li>
                </ol>
            </li>

            <li>
                <a href="#1">menu2</a>
                <ol class="submenu">
                    <li><a href="#1-2">menu1-2</a></li>
                    <li><a href="#1-2">menu1-2</a></li>
                </ol>
            </li>
            <li><a href="#1">menu3</a></li>
            <li><a href="#1">menu4</a></li>
        </ul>
    </div>
</body>
</html>
