<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
  <title></title>
  <style>
    table {width:280px; height: 100px; margin: 10px auto;} 
    h3{text-align:center;}
  </style>
  <script>
    const col = ['red','orange','yellow','green','blue','navy','purple','white'];
    window.onload = () => {
    var box = document.getElementsByTagName('td');   // 일반 for문이나 for in문 사용
      for(let idx in box){
        box[idx].style.backgroundColor = col[idx]; //td의 바탕색 변경
        //td들의 이벤트
        box[idx].onmouseover =()=> document.body.style.backgroundColor =col[idx];
        box[idx].onmouseout =()=> document.body.style.backgroundColor ='white';
        
      }
    };


    //const bgColorChange = n => document.body.style.backgroundColor= col[n];  
    
    //바탕색을 뭘로 바꿔라! ;
    //0번째 td부터 6번째 td까지 backgroun-color를 빨주노초파남보 입힌다(window.onload)
    //tag로 가져오기 => 배열로 잡힘 일반 for문 / for in 
    //선택자로 가져오기
    //const bgColorChange = n => //바탕색을 뭘로 바꿔라! ;
  </script>
</head>
<body>
  <h3>quiz : 마우스를 올리면 바탕화면도 해당 색상으로. 마우스를 빼면 다시 흰색 바탕으로</h3>
  <table>
    <tr>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </table>
</body>
</html>
