<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
<title></title>
<style>
    
</style>
<script>
  function Student(name, kor, mat, eng){
    this.name = name;
    this.kor = kor;
    this.mat = mat;
    this.eng = eng;
}//Student
//메소드는 prototype에 추가
Student.prototype.getSum = function(){
    return this.kor + this.mat + this.eng;
};
Student.prototype.getAvg = function(){
    //return Math.round(this.getSum()/3);//소숫점 첫번째 자리에서 반올림
    return (this.getSum()/3).toFixed(1);// 고정소숫점 한자리만 나타내기
};
Student.prototype.toString = function(){
    let output='';
                for(let key in this){
                    if (key!='getSum' && key!='getAvg' && key!='toString'){
                        output += key + ':' + this[key] + ' &nbsp; '; 
                    }else if(key=='getSum' || key=='getAvg'){
                        output += key.substring(3).toUpperCase() + ':' +this[key]()+ ' &nbsp;';  
                    }//if
                }; //for
                return output;
};      
let students = [new Student('홍길동', 90, 90, 94)];
students.push(new Student('김길동', 93, 97, 94));
students.push(new Student('이길동', 93, 93, 90));
students.push(new Student('박길동', 94, 92, 95));
students.push(new Student('정길동', 91, 91, 90));
students.push(new Student('조길동', 93, 94, 91));
students.forEach(data => document.write(data + '<br>'));
students.sort();//toString()결과를 ascii코드로 오름차순 정렬
document.write('<h3>이름 순 정렬</h3>');
students.forEach(data => document.write(data + '<br>'));

//총점 기준으로 내림차순 정렬
//정렬된 데이터 출력
//top3만 출출해서 출력

document.write('<h3>총점 순 정렬</h3>');
students.sort((left,right)=>{return right.getSum()-left.getSum()});
students.forEach(data => document.write(data + '<br>'));
let top3 = students.slice(0,3); 
document.write('<h3>Top3 </h3>');
top3.forEach(data => document.write(data+'<br>'));
</script>
</head>
