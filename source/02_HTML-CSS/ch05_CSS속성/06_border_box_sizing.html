<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        *{margin:0; padding:0;}
        div{width:100px; height:100px;}
        div:nth-child(1){background-color:yellow;}
        div:nth-child(2){background-color:green; border:5px solid red;
                         box-sizing:border-box;
        }
        div:nth-child(3){background-color:blue; border: 5px solid black;}
        ul {
            overflow: hidden;
            border: 1px solid black;
            width:450px;
            margin:0 auto;
        }
        ul li{float:left;
              list-style:none;
              border: 1px solid black;
              box-sizing:border-box;   /*border 공간을 width에 편입*/
              width:30.3333%;
              margin:1.5%;
              text-align:center;
        }
        a{text-decoration:none;
          border: 1px solid red;
          font-size:1.5em;
          display:block;/*부모 공간을 다쓴다*/
          
          padding:20px 0;
        }
    </style>
</head>
<body>
    <div>1111</div><div>2222</div><div>3333</div>
    <ul>
        <li><a href="http://www.naver.com" target="_blank">menu1</a></li>
        <li><a href="#2">menu2</a></li>
        <li><a href="#3">menu3</a></li>
    </ul>
</body>
</html>
