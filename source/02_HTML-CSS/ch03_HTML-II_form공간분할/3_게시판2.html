<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        span {
            color:red;
            font-weight: bold;
        }
        table {
            border-collapse:collapse;
            /*            border-top: 1px solid green;
            border-bottom: 5px dashed green;*/
        }
        tr {
            border-top :1px solid green;
            border-bottom : 1px solid green;
            border-collapse
        }
        td, th{padding:5px 10px;}
    </style>
    
</head>
<body>
  <form> <!--action="" method="get"-->
      <table>
          <caption><h2>게시판</h2></caption>
          <tr>
              <td>제목<span>*</span></td>
              <td><input type="text" name="title" size="26" required="required"/></td>
          </tr>
          <tr>
              <td>작성자<span>*</span></td>
              <td><input type="text" name="name" size="26"required="required" minlength="2"/></td>
          </tr>
          <tr>
              <td>본문</td>
              <td><textarea name="content" cols="30" rows="5" /></textarea></td>
          </tr>
          <tr>
              <td>첨부파일</td>
              <td><input type="file" name="filename"/></td>
          </tr>
          <tr>
              <th colspan="2">
                  <input type="submit" value="글쓰기" />
                  <input type="reset" />
              </th>
          </tr>

      </table>
  </form>
</body>
</html>
