<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>
    <script>
     let str = "   abc@ ABC @ abc ";
    document.write('원본 :'+ str + '<br>');
    document.write('글자수 :'+ str.length + '<br>');
    document.write('글자연결 :' + str.concat('뒤에서 연결') + '<br>');
    
    // str.substring(a) : a번째부터 끝까지 추출 str[a:]와 동일
    // str.substring(a,b): a번째부터 b번째 앞까지 추출 str[a:b]와 동일
    // str.substr(a,b) : a번째부터 b글자 추출
    document.write('3~5번째 :'+ str.substring(3,6) + '<br>');
    document.write('3번째~끝까지 :'+ str.substring(3) + '<br>');
    document.write('3번째 부터 6글자 :'+ str.substr(3,6) + '<br>');
    document.write('처음부터 @가 있는 위치:'+ str.indexOf('@') + '<br>');
    document.write('처음부터 !가 있는 위치:'+ str.indexOf('!') + '<br>'); //-1
    document.write('뒤부터 @가 있는 위치:'+ str.lastIndexOf('@') + '<br>');
    document.write('앞뒤 space제거:'+ str.trim() + '<br>');
    document.write('대문자:'+ str.toUpperCase() + '<br>');
    document.write('대문자:'+ str.toLowerCase() + '<br>');
    document.write('첫번째 @를 #으로 수정'+ str.replace('@','#') + '<br>');
    document.write('모든 @를 #으로 수정'+ str.replaceAll('@','#') + '<br>');
    document.write('모든 space제거'+ str.replaceAll(' ','') + '<br>');
    
    </script>
</head>
<body>
    
</body>
</html>
