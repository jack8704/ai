<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
<title></title>
<script>
    var arr=[1,'홍길동'];//  arr={'0':1, '1': '홍길동'} 처럼 인식 배열에서는 key가 index
    arr[0], arr[1]          // 0 1 은 idx
    arr.push('새로운값');
    for(let idx in arr){
        document.write(`${idx}(index타입:${typeof(idx)}) - ${arr[idx]}<br>`);
    }
    document.write(`<br>`);

    var obj={'name':'홍길동', 'age':20}; // 객체에서는 key가 속성변수        
    obj['name'],obj['age']   //속성변수(key)
    for(let key in obj){
        document.write(`${key}(key의 타입은${typeof(key)}) - ${obj[key]}<br>`);
    }
    document.write(`<br>`);
    obj.address = '신림동'; //객체에 속성 추가
    obj.hobby = '공부하기';
    for(let key in obj){
        document.write(`${key}(key의 타입은${typeof(key)}) - ${obj[key]}<br>`);
    }
    delete(obj.age); // 객체 속성 제거
    document.write(`<br>`);
    for(let key in obj){
        document.write(`${key}(key의 타입은${typeof(key)}) - ${obj[key]}<br>`);
    }
    
    
</script>
</head>
<body>
    
</body>
</html>
