<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>

<style>
    * {margin: 0;
        padding: 0;
    }
    div#nav{width: 800px;
            margin: 10px auto;
    }
    #nav ul{overflow:hidden;  /*부모단*/
            list-style : none;
            margin : 10px auto;}

        #nav ul li {
            float: left;
            list-style: none;
            margin: 2px;
            padding: 4px;
            text-align: center;
            border: 1px solid black;
            font-size: 1.3em;
        }
    a {text-decoration-line: none;
        font-weight: bold;
        color:black;
    }
    #nav li:nth-child(2n){/*#nav 밑의 짝수번째 li*/
                          background-color:yellow;
    }
    #nav li:nth-child(2n+1) { /*#nav 밑의 홀수번째 li*/
        background-color: orange;
    } 
    #nav li:first-child{/*#nav 아래의 첫번째 li*/
                        background-color:lightgray;
                        border-radius : 15px 0 0 15px;
    }
    #nav li:last-child { /*#nav 아래의 마지막li*/
        background-color: lightgray;
        border-radius: 0 15px 15px 0;
    }
</style>
<body>
    <div id="nav">
        <ul>
            <li><a href="#">menu1</a></li>
            <li><a href="#">menu2</a></li>
            <li><a href="#">menu3</a></li>
            <li><a href="#">menu4</a></li>
            <li><a href="#">menu5</a></li>
            <li><a href="#">menu6</a></li>
            <li><a href="#">menu7</a></li>
            <li><a href="#">menu8</a></li>
        </ul>
    </div>
</body>
</html>
