<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0" />
    <title></title>

    <script>
        //생성자 함수
        function Student(name, kor, mat, eng){
            this.name = name;
            this.kor = kor;
            this.mat = mat;
            this.eng = eng;
            this.getSum=function(){
                return this.kor + this.mat + this.eng;
            }; // this.getSum 
            this.getAvg=function(){
                return Math.round(this.getSum()/3);
            };// this.getAvg 
            this.toString=function(){
                let output='';
                for(let key in this){
                    if (key!='getSum' && key!='getAvg' && key!='toString'){
                        output += key + ':' + this[key] + ' &nbsp; '; 
                    }else if(key=='getSum' || key=='getAvg'){
                        output += key.substring(3).toUpperCase() + ':' +this[key]()+ ' &nbsp;';  
                    }//if
                }; //for
                return output;
            };// this.toString
        }//생성자함수 Student
        let students=[];
        students.push(new Student('홍길동', 90, 90, 98));
        students.push(new Student('김길동', 91, 96, 91));
        students.push(new Student('이길동', 92, 95, 92));
        students.push(new Student('박길동', 93, 94, 93));
        students.push(new Student('정길동', 94, 93, 94));
        students.forEach(element => document.write(element+'<br>'));
        Student.prototype
    </script>
</head>

</html>
